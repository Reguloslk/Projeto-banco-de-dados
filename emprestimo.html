<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Empréstimo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark" style="background:#1F4E79">
    <div class="container"><span class="navbar-brand">BibliotecaFácil</span></div>
  </nav>
  <main class="container py-4" style="max-width:560px">
    <div class="card p-4">
      <h1 class="h4">Empréstimo</h1>
      <form method="post">
        <label class="form-label">Matrícula</label>
        <input class="form-control mb-3" name="matricula" value="2026001">
        <label class="form-label">ISBN</label>
        <input class="form-control mb-3" name="isbn" value="9780000000011">
        <button class="btn text-white" style="background:#0F6E6B">Confirmar</button>
        <a class="btn btn-light" href="/acervo">Voltar ao acervo</a>
      </form>
      {% if mensagem %}
      <div class="alert alert-danger mt-3">{{ mensagem }}. Não foi gravado empréstimo.</div>
      {% endif %}
    </div>
  </main>
</body>
</html>
