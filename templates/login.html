{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="card p-4 mx-auto" style="max-width:480px">
  <h1 class="h4">Entrar</h1>
  <p class="text-secondary">Só a bibliotecária acessa o balcão.</p>
  <form method="post">
    <label class="form-label">E-mail</label>
    <input class="form-control mb-3" name="email" value="biblioteca@escola.br">
    <label class="form-label">Senha</label>
    <input class="form-control mb-3" name="senha" type="password" value="1234">
    <button class="btn text-white" style="background:#0F6E6B">Entrar</button>
  </form>
  {% if mensagem %}
  <div class="alert alert-danger mt-3">{{ mensagem }}</div>
  {% endif %}
</div>
{% endblock %}
