{% extends "base.html" %}
{% block titulo %}Atrasos{% endblock %}
{% block conteudo %}
<div class="card p-4">
  <h1 class="h4">Atrasos</h1>
  <table class="table">
    <tr><th>Aluno</th><th>Matrícula</th><th>Livro</th><th>Prevista</th></tr>
    {% for nome, matricula, titulo, prevista in atrasos %}
    <tr>
      <td>{{ nome }}</td>
      <td>{{ matricula }}</td>
      <td>{{ titulo }}</td>
      <td>{{ prevista }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">Nenhum atraso no momento.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
