{% extends "base.html" %}
{% block titulo %}Empréstimo{% endblock %}
{% block conteudo %}
<div class="card p-4 mx-auto" style="max-width:560px">
  <h1 class="h4">Empréstimo</h1>
  <p class="text-secondary">Matrícula, ISBN e confirmar. Prazo de 7 dias.</p>
  <form method="post">
    <label class="form-label">Matrícula</label>
    <input class="form-control mb-3" name="matricula" value="2026001">
    <label class="form-label">ISBN</label>
    <input class="form-control mb-3" name="isbn" value="9780000000011">
    <button class="btn text-white" style="background:#0F6E6B">Confirmar</button>
    <a class="btn btn-light" href="{{ url_for('acervo') }}">Voltar ao acervo</a>
  </form>
  {% if mensagem %}
  <div class="alert alert-danger mt-3">{{ mensagem }}</div>
  {% endif %}
</div>
{% endblock %}
