<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>BibliotecaFácil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark" style="background:#1F4E79">
    <div class="container"><span class="navbar-brand">BibliotecaFácil</span></div>
  </nav>
  <main class="container py-4" style="max-width:520px">
    <div class="card p-4">
      <h1 class="h4">Entrar</h1>
      <p class="text-secondary">Só a bibliotecária acessa o balcão.</p>
      <form action="/acervo">
        <label class="form-label">E-mail</label>
        <input class="form-control mb-3" value="biblioteca@escola.br">
        <label class="form-label">Senha</label>
        <input class="form-control mb-3" type="password" value="1234">
        <button class="btn text-white" style="background:#0F6E6B">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
