<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Acervo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark" style="background:#1F4E79">
    <div class="container"><span class="navbar-brand">BibliotecaFácil</span></div>
  </nav>
  <main class="container py-4">
    <a class="btn text-white mb-3" style="background:#0F6E6B" href="/emprestar">Emprestar</a>
    <div class="card p-4">
      <h1 class="h4">Acervo</h1>
      <table class="table">
        <tr><th>Título</th><th>Autor</th><th>ISBN</th><th>Disponíveis</th></tr>
        {% for titulo, autor, isbn, disponiveis in livros %}
        <tr><td>{{ titulo }}</td><td>{{ autor }}</td><td>{{ isbn }}</td><td>{{ disponiveis }}</td></tr>
        {% else %}
        <tr><td colspan="4">Nenhum livro cadastrado ainda.</td></tr>
        {% endfor %}
      </table>
    </div>
  </main>
</body>
</html>
