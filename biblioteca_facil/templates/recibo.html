<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recibo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark" style="background:#1F4E79">
    <div class="container"><span class="navbar-brand">BibliotecaFácil</span></div>
  </nav>
  <main class="container py-4" style="max-width:520px">
    <div class="card p-4">
      <h1 class="h4">Recibo</h1>
      <p>Aluno: matrícula {{ matricula }}</p>
      <p>Livro: {{ titulo }}</p>
      <p>Devolver até: {{ prevista }} (7 dias)</p>
      <a class="btn text-white" style="background:#0F6E6B" href="/acervo">Voltar ao acervo</a>
    </div>
  </main>
</body>
</html>
